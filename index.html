<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Art Portfolio</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      font-size: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 60px;
    }

    .card {
      border: 1px solid #333;
      border-radius: 12px;
      padding: 40px 24px;
      min-height: 160px;
      display: flex;
      align-items: end;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Electronic Art</h1>
    <p>Objects, electronics, experiments and other things.</p>

    <section class="categories">
      <div class="card">Electronic Art</div>
      <div class="card">Objects & Sculpture</div>
      <div class="card">Props & Experiments</div>
    </section>
  </main>
</body>
</html>
