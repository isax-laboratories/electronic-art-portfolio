<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Art — Isak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      max-width: 1300px;
      margin: auto;
      padding: 70px 30px 40px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 90px);
      margin: 0;
      letter-spacing: -3px;
    }

    .intro {
      color: #999;
      font-size: 18px;
      margin-top: 15px;
    }

    .categories {
      max-width: 1300px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .category {
      position: relative;
      height: 480px;
      background: #1b1b1b;
      text-decoration: none;
      color: white;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .category:hover {
      transform: translateY(-5px);
    }

    .category-text {
      position: absolute;
      bottom: 0;
      padding: 25px;
    }

    .category h2 {
      margin: 0;
      font-size: 28px;
    }

    .category p {
      margin: 8px 0 0;
      color: #999;
    }

    footer {
      max-width: 1300px;
      margin: auto;
      padding: 80px 30px 40px;
      color: #666;
    }

    @media (max-width: 800px) {
      .categories {
        grid-template-columns: 1fr;
      }

      .category {
        height: 350px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Electronic Art</h1>
  <p class="intro">
    Electronic objects, sculpture, experiments and props.
  </p>
</header>

<main class="categories">

  <a class="category" href="electronic-art.html">
    <div class="category-text">
      <h2>Electronic Art</h2>
      <p>Light, electronics & interactive objects</p>
    </div>
  </a>

  <a class="category" href="objects.html">
    <div class="category-text">
      <h2>Objects & Sculpture</h2>
      <p>Physical objects, brass & mixed media</p>
    </div>
  </a>

  <a class="category" href="props.html">
    <div class="category-text">
      <h2>Props & Experiments</h2>
      <p>Wearables, props & strange experiments</p>
    </div>
  </a>

</main>

<footer>
  © 2026
</footer>

</body>
</html>
