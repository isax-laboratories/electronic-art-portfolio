<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Art — Isak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 1300px;
      margin: auto;
      padding: 50px 30px 80px;
    }

    a {
      color: inherit;
    }

    .back {
      display: inline-block;
      margin-bottom: 50px;
      color: #888;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(42px, 7vw, 80px);
      margin: 0 0 50px;
      letter-spacing: -2px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .work {
      text-decoration: none;
      display: block;
    }

    .image {
      aspect-ratio: 4 / 3;
      background: #1b1b1b;
      margin-bottom: 15px;
      transition: transform 0.2s ease;
    }

    .work:hover .image {
      transform: translateY(-4px);
    }

    .work h2 {
      margin: 0;
      font-size: 24px;
    }

    .work p {
      margin: 6px 0 0;
      color: #777;
    }

    @media (max-width: 750px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <a class="back" href="index.html">← Back</a>

    <h1>Electronic Art</h1>

    <section class="gallery">

      <a class="work" href="hekfods.html">
        <div class="image"></div>
        <h2>HEKFODS</h2>
        <p>Electronic sculpture</p>
      </a>

      <a class="work" href="work-02.html">
        <div class="image"></div>
        <h2>Untitled 02</h2>
        <p>Electronic object</p>
      </a>

      <a class="work" href="work-03.html">
        <div class="image"></div>
        <h2>Untitled 03</h2>
        <p>Light & electronics</p>
      </a>

    </section>

  </main>

</body>
</html>
