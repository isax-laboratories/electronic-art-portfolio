<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Electronic Art</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<main class="wrap">

  <a class="back" href="{{ site.baseurl }}/">← Back</a>

  <h1>Electronic Art</h1>

  <section class="gallery">

    {% for artwork in site.artworks %}
      {% if artwork.category == "electronic-art" %}

        <a class="work" href="{{ site.baseurl }}{{ artwork.url }}">

          <div class="image">
            {% if artwork.cover %}
              <img
                src="{{ site.baseurl }}{{ artwork.cover }}"
                alt="{{ artwork.title }}">
            {% endif %}
          </div>

          <h2>{{ artwork.title }}</h2>

          {% if artwork.year %}
            <p>{{ artwork.year }}</p>
          {% endif %}

        </a>

      {% endif %}
    {% endfor %}

  </section>

</main>

</body>
</html>
