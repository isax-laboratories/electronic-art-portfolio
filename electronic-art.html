<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Art</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 1300px;
      margin: auto;
      padding: 50px 30px 100px;
    }

    .back {
      display: inline-block;
      margin-bottom: 50px;
      color: #888;
      text-decoration: none;
    }

    .back:hover { color: white; }

    h1 {
      font-size: clamp(42px, 7vw, 80px);
      margin: 0 0 60px;
      letter-spacing: -2px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px 30px;
    }

    .work {
      color: inherit;
      text-decoration: none;
    }

    .image {
      aspect-ratio: 4 / 3;
      background: #1b1b1b;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .work:hover .image img {
      transform: scale(1.02);
    }

    .work h2 {
      margin: 0;
      font-size: 24px;
    }

    .work p {
      margin: 5px 0 0;
      color: #777;
    }

    @media (max-width: 750px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="wrap">

  <a class="back" href="{{ site.baseurl }}/">← Back</a>

  <h1>Electronic Art</h1>

  <section class="gallery">

    {% for artwork in site.artworks %}
      {% if artwork.category == "electronic-art" %}

        <a class="work" href="{{ site.baseurl }}{{ artwork.url }}">

          <div class="image">
            {% if artwork.cover %}
              <img
                src="{{ site.baseurl }}{{ artwork.cover }}"
                alt="{{ artwork.title }}">
            {% endif %}
          </div>

          <h2>{{ artwork.title }}</h2>

          {% if artwork.year %}
            <p>{{ artwork.year }}</p>
          {% endif %}

        </a>

      {% endif %}
    {% endfor %}

  </section>

</main>

</body>
</html>
